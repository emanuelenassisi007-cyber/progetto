<!DOCTYPE html>
<html lang="it">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Fitness Tracker</title>
</head>
<body>
  <h1>Fitness Tracker</h1>

  <h3>Dati giornalieri</h3>
  <input type="number" id="calorie" placeholder="Calorie">
  <input type="number" id="peso" placeholder="Peso (kg)">
  <input type="number" id="obiettivo" placeholder="Obiettivo (kg)">
  <button onclick="salva()">Salva giorno</button>

  <h3>Calcolo calorie</h3>
  <input type="number" id="eta" placeholder="Età">
  <input type="number" id="altezza" placeholder="Altezza (cm)">
  <select id="sesso">
    <option value="uomo">Uomo</option>
    <option value="donna">Donna</option>
  </select>
  <button onclick="calcolaCalorie()">Calcola fabbisogno</button>

  <div class="box">Calorie consigliate: <span id="calCons">0</span></div>

  <h3>Stato</h3>
  <div class="box">Kg da perdere: <span id="diff">0</span></div>

  <h3>Storico</h3>
  <div id="storico"></div>

  <canvas id="grafico" width="400" height="200"></canvas>
<script src="script.js"></script>
</body>
</html>
